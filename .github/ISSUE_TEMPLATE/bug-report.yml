name: Report an installation problem
description: Help reproduce an installer, catalog, or adapter problem.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Remove credentials, private paths, and sensitive repository content before posting. For vulnerabilities, follow SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Release or Git commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, target agent and version, Node.js or uv version if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the command, selected tools or profile, and minimal existing configuration when relevant.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized output
      render: text
    validations:
      required: true
