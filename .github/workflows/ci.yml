name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint Python
        run: uv run ruff check .

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest -q --junitxml=test-results/junit.xml
      - name: Build wheel and source distribution
        run: uv build
      - name: Verify isolated wheel installation
        run: uv run python scripts/check_dist.py
      - name: Build and smoke-test isolated runtime
        shell: bash
        run: |
          uv run python scripts/build_runtime.py --output dist/runtime
          uv run python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          manifest = json.loads(Path("dist/runtime/runtime.json").read_text(encoding="utf-8"))
          runtime = Path("dist/runtime") / manifest["asset"]["url"].rsplit("/", 1)[1]
          subprocess.run([sys.executable, "-I", "-S", str(runtime), "--version"], check=True)
          subprocess.run([sys.executable, "-I", "-S", str(runtime), "profiles", "--json"], check=True)
          PY
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results/junit.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload distribution packages
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/runtime/*
          if-no-files-found: error
          retention-days: 14

  npm:
    name: npm shell (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: macos-latest
            node: '22'
          - os: windows-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: npm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install npm shell dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Test launcher and cache behavior
        run: npm test
      - name: Check npm package contents
        run: npm pack --dry-run --ignore-scripts
      - name: Set up Python for packed launcher smoke test
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Verify installed npm tarball with bundled runtime
        working-directory: .
        run: |
          uv sync --locked
          uv run python scripts/build_runtime.py
          npm --prefix npm run test:package
